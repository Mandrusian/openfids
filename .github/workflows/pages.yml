name: Validate OpenFIDS website
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "index.html"
      - "demo/**"
      - "app/index.html"
      - "app/database.py"
      - "scripts/build_pages.py"
      - "tests/test_pages.py"
      - "tests/test_demo.js"
      - ".github/workflows/pages.yml"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openfids-website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test website
        run: |
          python scripts/build_pages.py
          python -m unittest discover -s tests -p test_pages.py -v
          node --check docs/site.js
          node --check docs/demo/shim.js
          node tests/test_demo.js
      - name: Verify committed Pages output is current
        run: git diff --exit-code -- docs/demo/index.html docs/demo/database.json index.html demo/index.html
      # GitHub's built-in Pages workflow publishes main from /(root).
      # Do not also deploy an Actions artifact: that conflicts with branch publishing.
