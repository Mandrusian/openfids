name: Deploy OpenFIDS website
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "app/index.html"
      - "app/database.py"
      - "scripts/build_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate demo from OpenFIDS
        run: python scripts/build_pages.py
      - name: Syntax check website
        run: |
          node --check docs/site.js
          node --check docs/demo/shim.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
